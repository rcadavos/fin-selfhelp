name: Supabase migrations

# Applies anything new in supabase/migrations/ to the hosted database.
#
# Pushes to master apply. Pull requests get a dry run instead, so a migration
# that cannot be parsed or would fail is caught before it reaches the live
# schema rather than after.

on:
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# One run against the database at a time, and never cancel one that is already
# going: a cancelled push can leave a migration half applied.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

env:
  # Not a secret. The same ref is already public in NEXT_PUBLIC_SUPABASE_URL.
  SUPABASE_PROJECT_REF: qsszsofppatihkporecq
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    name: ${{ github.event_name == 'pull_request' && 'Dry run' || 'Apply' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned on purpose: `latest` would let a CLI release change how a
          # migration is applied without anything in this repo changing.
          version: 2.98.2

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Prints Local | Remote side by side, so the log records what was
      # outstanding before anything ran — useful when a later run surprises you.
      - name: Show migration state
        run: supabase migration list --linked

      - name: Dry run
        if: github.event_name == 'pull_request'
        run: supabase db push --linked --dry-run

      - name: Apply
        if: github.event_name != 'pull_request'
        run: supabase db push --linked

      - name: Show migration state after apply
        if: github.event_name != 'pull_request'
        run: supabase migration list --linked
